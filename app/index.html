<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERGLOW — GTA-style cover art studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span class="logo" id="logo">AFTERGLOW</span>
  <span class="hint">cover art studio — your photo in, GTA-style poster out</span>
  <span class="spacer"></span>
  <label class="filelabel" for="photoFile" id="addPhotos">＋ Add photos</label>
  <input type="file" id="photoFile" accept="image/*" multiple hidden>
  <select id="template" title="panel layout">
    <option value="hero">Hero + side panels</option>
    <option value="duo">Big two</option>
    <option value="grid">Poster grid</option>
  </select>
  <select id="size" title="preview size">
    <option value="square">1080 × 1080</option>
    <option value="portrait">1080 × 1350</option>
    <option value="wide">1920 × 1080</option>
  </select>
  <button class="export-btn" id="exportSquare">PNG <b>1:1</b></button>
  <button class="export-btn" id="exportPortrait">PNG <b>4:5</b></button>
  <button class="export-btn" id="exportWide">PNG <b>16:9</b></button>
</header>
<main>
  <div id="stage">
    <span id="stageLabel"></span>
    <canvas id="preview" width="1080" height="1350"></canvas>
  </div>
  <aside id="controls">
    <section id="photosSection">
      <h3>Photos</h3>
      <div id="photoStrip"></div>
      <p class="hint" id="photoHint">Photos stay on your machine — nothing is uploaded.<br>
      Click a photo, then a panel, to place it. Drag on a panel to move it, wheel to zoom.</p>
    </section>
    <section id="captionSection">
      <h3>Caption</h3>
      <div class="row"><label>Title</label><input type="text" id="title" maxlength="16" value="AFTERGLOW"></div>
      <div class="row"><label>Tagline</label><input type="text" id="tagline" maxlength="40" value="EVERY PHOTO HAS A STORY"></div>
      <div class="switch-row">
        <input type="checkbox" id="panelCaptions" checked>
        <label for="panelCaptions">panel captions</label>
      </div>
    </section>
    <section id="panelsSection">
      <h3>Panels</h3>
      <div id="panelList"></div>
    </section>
    <section id="exportSection">
      <h3>Export</h3>
      <button class="primary" id="exportAllHint" title="buttons in the top bar">▼ Use the PNG buttons in the top bar</button>
      <div id="exportNote"></div>
    </section>
  </aside>
</main>
<script type="module" src="editor.js"></script>
</body>
</html>
